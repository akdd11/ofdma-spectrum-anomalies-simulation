

hyperparameters:
  train_batch_size: 1024
  inference_batch_size: 21
  supervised:
    Regression_n_epochs: 100
    Classification_n_epochs: 100
  unsupervised:
    n_epochs: 300
    beta: 0.001

model:
  latent_dim: 128  # dimensionality of the latent space (for VAE)
  img_size:
    time: 110  # time
    freq: 70   # frequency

  channels: 1  # number of image channels
  n_SUs: 21
dataset_nr: 3  # subfolder of the datasets folder given in datapath.txt of the repository root

# data split config
supervised:
  num_train_normal: 5900
  num_train_anomaly: 5900

  num_valid_normal: 100
  num_valid_anomaly: 100

  num_test_normal: 1000
  num_test_anomaly: 2500

unsupervised:
  num_train_normal: 8800
  num_valid_normal: 200

  num_test_normal: 1000
  num_test_anomaly: 2500