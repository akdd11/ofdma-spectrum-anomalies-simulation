[pydoctor]
project-name = "OFDMA Spectrum Anomaly Simulation"
project-url = https://github.com/akdd11/ofdma-spectrum-anomalies-simulation
project-base-dir = .
# links to the source on GitHub; the CI workflow overrides this with the commit hash
html-viewsource-base = https://github.com/akdd11/ofdma-spectrum-anomalies-simulation/blob/main
html-base-url = https://akdd11.github.io/ofdma-spectrum-anomalies-simulation/

# the scripts and the utils package are documented as separate roots, so that
# they are not shown below the (meaningless) name "src"
add-package = ["./src/utils", "./src/dataset_generation.py", "./src/custom_data_export.py", "./src/plot_figures.py"]
docformat = numpy
mod-member-order = source
# module level helper variables of the scripts (sys.path and config bootstrapping)
privacy = ["HIDDEN:*._datapath", "HIDDEN:*._module_path", "HIDDEN:*._repo_name", "HIDDEN:*._config_path", "HIDDEN:*._gpu_id"]

# banner, start page and footer (overrides of the default pydoctor templates)
template-dir = ./docs_templates

make-html = True
use-hardlinks = True

html-output = docs
